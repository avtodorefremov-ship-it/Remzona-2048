<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ремзона 2048</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#eceef1;--fg:#22252b;--muted:#5f6670;--board:#c9cdd3;--cell:#dde0e5;--accent:#7a2e2e;
--disp:"Arial Black","Segoe UI",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d21;--fg:#e8e9ec;--muted:#9aa0a8;--board:#2c2f35;--cell:#373a41;--accent:#d98a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d21;--fg:#e8e9ec;--muted:#9aa0a8;--board:#2c2f35;--cell:#373a41;--accent:#d98a6a;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-width:460px;margin:0 auto;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--disp);font-weight:900;font-size:1.45rem;margin:0;line-height:1.1}
h1 span{color:var(--accent)}
.scores{display:flex;gap:6px}
.sc{background:var(--board);border-radius:8px;padding:5px 10px;text-align:center;min-width:58px}
.sc b{display:block;font-family:var(--disp);font-size:1.05rem;font-variant-numeric:tabular-nums}
.sc small{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.goal{color:var(--muted);font-size:.9rem;margin:0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{position:relative;width:min(100%,62vh);aspect-ratio:1;box-sizing:border-box;background:var(--board);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.cell{background:var(--cell);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;overflow:hidden;min-width:0;min-height:0}
.cell .n{font-family:var(--disp);font-size:clamp(1rem,6.5vw,1.7rem);line-height:1}
.cell .t{font-size:clamp(.55rem,2.6vw,.75rem);font-weight:700;line-height:1.1;padding:0 3px}
.pop{animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.shake{animation:shake .18s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.over,.hint{position:absolute;inset:0;z-index:5;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.over button{min-width:150px}
.over{background:color-mix(in srgb,var(--bg) 88%,transparent);font-family:var(--disp);font-size:1.35rem}
.over small{font-family:var(--body);font-size:.95rem;color:var(--muted)}
.hint{pointer-events:none;background:color-mix(in srgb,var(--bg) 55%,transparent);font-weight:700;font-size:1.05rem}
.hand{font-size:2.6rem;animation:swipe 1.4s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
.btns{display:flex;gap:10px}
.btns button{flex:1}
button{font:700 1rem var(--body);background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 14px;cursor:pointer;touch-action:manipulation}
button.ghost{background:var(--board);color:var(--fg)}
@media (prefers-reduced-motion:reduce){.pop,.shake,.hand{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Рем<span>зона</span><br>2048</h1>
    <div class="scores">
      <div class="sc"><small>Счёт</small><b id="score">0</b></div>
      <div class="sc"><small>Рекорд</small><b id="best">0</b></div>
    </div>
  </header>
  <p class="goal">Соединяй одинаковые запчасти и собери автогрейдер</p>
  <div class="stage">
    <div class="board" id="board">
      <div class="hint" id="hint"><div class="hand">👆</div>Проведи пальцем<br>в любую сторону</div>
      <div class="over" id="over" hidden><div id="overText"></div><button id="again" type="button">Ещё раз</button></div>
    </div>
  </div>
  <div class="btns">
    <button id="new" type="button" class="ghost">Заново</button>
    <button id="share" type="button">Поделиться</button>
  </div>
</div>
<script>
// ===== НАСТРОЙКИ =====
const BOT_URL = "https://t.me/remzona2048_bot/play";            // ссылка на игру, например https://t.me/remzona2048_bot/play
const ADSGRAM_BLOCK_ID = "";   // ID блока из partner.adsgram.ai, например "int-12345"
const GAMES_PER_AD = 2;        // реклама после каждой N-й проигранной партии
// =====================

const PARTS={2:"Болт",4:"Гайка",8:"Подшипник",16:"Фильтр",32:"Ремень",64:"Насос",128:"Форсунка",256:"Турбина",512:"КПП",1024:"Двигатель",2048:"Автогрейдер",4096:"Амкодор",8192:"Снегопогрузчик"};
const COLORS={2:"#f3e6b0",4:"#f1d98a",8:"#f2c94c",16:"#f0b429",32:"#e8912d",64:"#d9702a",128:"#9fb7c9",256:"#6f93ad",512:"#4b6f8c",1024:"#7a2e2e",2048:"#3b3f46"};
const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.platform!=="unknown"?Telegram.WebApp:null;
const board=document.getElementById("board"),over=document.getElementById("over"),hint=document.getElementById("hint");
let g,score,best=0,won,gamesOver=0;

if(tg){
  tg.ready();tg.expand();
  try{tg.disableVerticalSwipes()}catch(e){}   // чтобы свайп вниз не закрывал игру
  if(tg.colorScheme)document.documentElement.dataset.theme=tg.colorScheme;
  try{tg.setHeaderColor("bg_color");tg.setBackgroundColor("bg_color")}catch(e){}
}
function vibrate(kind){try{if(tg&&tg.HapticFeedback){kind==="err"?tg.HapticFeedback.notificationOccurred("error"):tg.HapticFeedback.impactOccurred(kind)}else if(navigator.vibrate)navigator.vibrate(kind==="err"?60:12)}catch(e){}}

try{best=+localStorage.getItem("rz2048best")||0}catch(e){}
if(tg&&tg.CloudStorage){try{tg.CloudStorage.getItem("best",(err,v)=>{if(!err&&+v>best){best=+v;draw()}})}catch(e){}}
function saveBest(){try{localStorage.setItem("rz2048best",best)}catch(e){}try{tg&&tg.CloudStorage&&tg.CloudStorage.setItem("best",String(best))}catch(e){}}

const cells=[];for(let i=0;i<16;i++){const c=document.createElement("div");c.className="cell";board.insertBefore(c,hint);cells.push(c)}
let hintShown=true;try{hintShown=!localStorage.getItem("rz2048hint")}catch(e){}
hint.hidden=!hintShown;

function empty(){const e=[];g.forEach((v,i)=>{if(!v)e.push(i)});return e}
function add(){const e=empty();if(!e.length)return -1;const i=e[Math.random()*e.length|0];g[i]=Math.random()<.9?2:4;return i}
function start(){g=Array(16).fill(0);score=0;won=false;over.hidden=true;add();add();draw()}
function draw(fresh=[]){
  cells.forEach((c,i)=>{const v=g[i];
    if(!v){c.innerHTML="";c.style.background="";c.style.color="";c.className="cell";return}
    c.innerHTML=`<span class="n">${v}</span><span class="t">${PARTS[v]||"Техника"}</span>`;
    c.style.background=COLORS[v]||"#22252b";c.style.color=v>=128?"#fff":"#22252b";
    c.className="cell"+(fresh.includes(i)?" pop":"")});
  document.getElementById("score").textContent=score;
  if(score>best){best=score;saveBest()}
  document.getElementById("best").textContent=best;
}
function line(row){const a=row.filter(Boolean),out=[],m=[];
  for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);score+=a[i]*2;m.push(out.length-1);i++}else out.push(a[i])}
  while(out.length<4)out.push(0);return[out,m]}
function move(dir){ // 0 влево, 1 вправо, 2 вверх, 3 вниз
  if(!over.hidden)return;
  if(!hint.hidden){hint.hidden=true;try{localStorage.setItem("rz2048hint","1")}catch(e){}}
  const before=g.join(),fresh=[];
  for(let k=0;k<4;k++){
    let idx=[0,1,2,3].map(j=>dir<2?k*4+j:j*4+k);if(dir===1||dir===3)idx.reverse();
    const[res,m]=line(idx.map(i=>g[i]));idx.forEach((i,j)=>g[i]=res[j]);m.forEach(j=>fresh.push(idx[j]));
  }
  if(g.join()===before){board.classList.remove("shake");void board.offsetWidth;board.classList.add("shake");return}
  vibrate(fresh.length?"medium":"light");
  fresh.push(add());draw(fresh);
  if(!won&&g.includes(2048)){won=true;show("Автогрейдер собран! 🏆<br><small>Можно играть дальше</small>",true)}
  else if(dead()){vibrate("err");show("Запчасти кончились<br><small>Счёт: "+score+"</small>");gameOver()}
}
function dead(){if(empty().length)return false;
  for(let i=0;i<16;i++){if(i%4<3&&g[i]===g[i+1])return false;if(i<12&&g[i]===g[i+4])return false}return true}
function show(t,cont){document.getElementById("overText").innerHTML=t;const b=document.getElementById("again");
  b.textContent=cont?"Продолжить":"Ещё раз";b.onclick=cont?()=>{over.hidden=true}:start;over.hidden=false}

// --- Управление: свайп в любом месте экрана ---
let sx=null,sy=null;
function begin(x,y){sx=x;sy=y}
function finish(x,y){if(sx===null)return;const dx=x-sx,dy=y-sy;sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
  Math.abs(dx)>Math.abs(dy)?move(dx<0?0:1):move(dy<0?2:3)}
document.addEventListener("touchstart",e=>{if(e.target.closest("button"))return;begin(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
document.addEventListener("touchmove",e=>{e.preventDefault()},{passive:false});
document.addEventListener("touchend",e=>{const t=e.changedTouches[0];finish(t.clientX,t.clientY)});
document.addEventListener("mousedown",e=>{if(!e.target.closest("button"))begin(e.clientX,e.clientY)});
document.addEventListener("mouseup",e=>finish(e.clientX,e.clientY));
const KEYS={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,a:0,d:1,w:2,s:3,ф:0,в:1,ц:2,ы:3};
document.addEventListener("keydown",e=>{const d=KEYS[e.key.length===1?e.key.toLowerCase():e.key];if(d!==undefined){e.preventDefault();move(d)}});

// --- Поделиться ---
document.getElementById("share").onclick=()=>{
  const text=`Мой рекорд в «Ремзоне 2048» — ${best} очков. Сможешь собрать автогрейдер?`;
  if(tg&&BOT_URL){tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(BOT_URL)+"&text="+encodeURIComponent(text));return}
  if(navigator.share){navigator.share({text:text+(BOT_URL?" "+BOT_URL:"")}).catch(()=>{});return}
  try{navigator.clipboard.writeText(text+(BOT_URL?" "+BOT_URL:""))}catch(e){}
};
document.getElementById("new").onclick=start;

// --- Реклама Adsgram (включается, когда указан ADSGRAM_BLOCK_ID) ---
let ads=null;
if(ADSGRAM_BLOCK_ID&&tg){const s=document.createElement("script");s.src="https://sad.adsgram.ai/js/sad.min.js";
  s.onload=()=>{try{ads=window.Adsgram.init({blockId:ADSGRAM_BLOCK_ID})}catch(e){}};document.head.appendChild(s)}
function gameOver(){gamesOver++;try{window.Android&&Android.gameOver()}catch(e){}if(ads&&gamesOver%GAMES_PER_AD===0){setTimeout(()=>ads.show().catch(()=>{}),600)}}

start();
</script>
</body>
</html>
